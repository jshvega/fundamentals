<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>FUNDAMENTALS — Calculator</title>
        <link rel="stylesheet" href="/calculator/style.css">
        <link rel="stylesheet" href="/global.css">

        <!-- Primary meta -->
        <title>FUNDAMENTALS — Calculator</title>
        <meta name="description" content="Basic calculator built from scratch. No AI.">
        <!-- Open Graph -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://fundamentals.manfred.studio/media/og-image.png">
        <meta property="og:title" content="FUNDAMENTALS — Calculator">
        <meta property="og:description" content="Basic calculator built from scratch. No AI.">
        <meta property="og:image" content="https://fundamentals.manfred.studio/media/og-image.png">
        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="FUNDAMENTALS — Calculator">
        <meta name="twitter:description" content="Basic calculator built from scratch. No AI.">
        <meta name="twitter:image" content="https://fundamentals.manfred.studio/og-image.png">

        <!-- favicon -->
        <link rel="icon" href="/media/favicon.ico" sizes="32x32">
        <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/media/apple-touch-icon.png">

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    </head>

    <body id="body">
        <!------------------- GLOBAL ------------------->
        <!-- PRELOADER -->
        <div class="preloader">
            <img class="preloader-logo" src="/media/M_LOGO_480_POSITIVE.png" alt="Manfred Logo">
            <div class="preloader-bottom">
                <div class="preloader-headline">
                    <div class="word-wrap"><span class="word">Back</span></div>
                    <div class="word-wrap"><span class="word">to</span></div>
                    <div class="word-wrap"><span class="word">basics.</span></div>
                </div>
            <div class="preloader-copy">©2026</div>
            </div>
        </div>
        <!------------------- GLOBAL ------------------->

        <section id="wrapper-calculator">

            <header id="header-main">
                <div class="header-main-nav">
                    <a href="/index.html" class="linkEffect">FUNDAMENTALS</a>
                    <hr class="hr-main">
                    <p>The Calculator</p>
                </div>
            </header>

            <section id="main">

                <div class="calculator-grid">

                    <output class="output-screen">
                        <div data-previous-operand class="prev-operand">618 +</div>
                        <div data-current-operand class="curr-operand">2,484.61</div>
                    </output>

                    <button data-all-clear class="button-dark spantwo">AC</button>
                    <button data-clear class="button-dark">C</button>
                    <button data-operator class="button-accent">÷</button>

                    <button data-number class="button-base">1</button>
                    <button data-number class="button-base">2</button>
                    <button data-number class="button-base">3</button>
                    <button data-operator class="button-accent">*</button>
                    
                    <button data-number class="button-base">4</button>
                    <button data-number class="button-base">5</button>
                    <button data-number class="button-base">6</button>
                    <button data-operator class="button-accent">+</button>

                    <button data-number class="button-base">7</button>
                    <button data-number class="button-base">8</button>
                    <button data-number class="button-base">9</button>
                    <button data-operator class="button-accent">-</button>

                    <button data-number class="spantwo button-base">0</button>
                    <button data-decimal class="button-base">.</button>
                    <button data-equals class="button-accent">=</button>

                </div>

            </section>

            <footer id="footer-line">
                <div class="footer-line-sub">
                    <hr class="hr-main">
                </div>
            </footer>

        </section>

        <script src="/calculator/script.js"></script>
        <script src="/global.js"></script>
    </body>

</html>
